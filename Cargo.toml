[package]
name = "llm_readability"
version = "0.0.17"
edition = "2021"
description = "Readability library for LLM's built in Rust"
keywords = ["readability", "clean-html", "safari-reader"]
authors = [
    "j-mendez <jeff@spider.cloud>"
]
repository = "https://github.com/spider-rs/llm-readability"
readme = "README.md"
categories = ["web-programming", "command-line-utilities"]
license = "MIT"
documentation = "https://docs.rs/llm_readability"

[dependencies]
url = "2"
html5ever = { version = "0.39", package = "spider-html5ever" }
markup5ever = { version = "0.39", package = "spider-markup5ever" }
tendril = { version = "0.5", package = "spider-tendril" }
regex = "1"
auto_encoder = "0.2"
tokio = { version = "1", default-features = false, features = ["rt", "io-util", "sync"], optional = true }

[features]
default = []
tokio = ["dep:tokio"]

[dev-dependencies]
maud = "0.27"
criterion = { version = "0.8", features = ["html_reports"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "io-util", "sync"] }

[[bench]]
name = "extraction"
harness = false
